[package]
name = "wordmaker"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/wordmaker-admin"]

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny`, not `forbid`: memory-mapping the GeoIP databases needs one
# documented exception (src/analytics/geo.rs).
unsafe_code = "deny"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[lints]
workspace = true

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
# Panics unwind (the default): one in a request's blocking task then fails
# that request with a 500 instead of taking the whole server down.
opt-level = 3
debug = false
strip = "none"
incremental = false

[dependencies]
adocers-html = "0.3"
anyhow = "1"
asciidoc-parser = "0.31"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clickhouse = { version = "0.15", default-features = false, features = [
  "chrono",
  "rustls-tls",
] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "gif",
] }
lol_html = "3"
maxminddb = { version = "0.32", features = ["mmap"] }
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
] }
rmcp = { version = "3", features = [
  "server",
  "macros",
  "transport-io",
  "transport-streamable-http-server",
  "client",
  "transport-streamable-http-client-reqwest",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "chrono",
  "macros",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
  "trace",
  "limit",
  "fs",
  "compression-gzip",
  "compression-br",
  "set-header",
  "cors",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
woothee = "0.13"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
clickhouse = { version = "0.15", default-features = false, features = [
  "test-util",
  "chrono",
] }
http-body-util = "0.1"
testcontainers-modules = { version = "0.15", features = ["clickhouse"] }
