[package]
name = "wordmaker"
version = "0.1.0"
edition = "2024"

[dependencies]

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
debug = false
strip = "none"
incremental = false
