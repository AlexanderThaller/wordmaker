[package]
name = "wordmaker-admin"
version = "0.1.0"
edition = "2024"
description = "Web interface for editing and previewing a WordMaker site"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
cookie = "0.18"
hmac = "0.12.1"
openidconnect = { version = "4.0.1", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
chrono = "0.4.45"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
